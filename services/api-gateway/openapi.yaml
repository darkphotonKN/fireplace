components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable domain error code — switch on THIS, not on detail
          examples:
            - NOT_FOUND
          type: string
        detail:
          description: Explanation specific to this occurrence
          type: string
        errors:
          description: Field-level detail; empty for downstream failures
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          description: HTTP status code
          format: int64
          type: integer
        title:
          description: Short, stable summary of the problem type
          type: string
        type:
          description: URI reference identifying the problem type
          type: string
      required:
        - code
        - errors
      type: object
    ProfileResponse:
      additionalProperties: false
      properties:
        bio:
          description: Optional short biography
          type:
            - string
            - "null"
        createdAt:
          description: When the account was created
          format: date-time
          type: string
        displayName:
          description: Optional display name
          examples:
            - kn
          type:
            - string
            - "null"
        email:
          description: Email address
          examples:
            - a@b.com
          type: string
        id:
          description: User id
          type: string
        name:
          description: Account name
          examples:
            - Kranti
          type: string
        updatedAt:
          description: When the profile was last changed
          format: date-time
          type: string
      required:
        - id
        - email
        - name
        - displayName
        - bio
        - createdAt
        - updatedAt
      type: object
    UpdateProfileRequest:
      additionalProperties: false
      properties:
        bio:
          type: string
        displayName:
          type: string
        name:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token sent as `Authorization: Bearer <token>`."
      scheme: bearer
      type: http
info:
  description: The HTTP surface of the Fireplace api-gateway. This document is generated from the typed handlers and is the only description of the API — there is no second, hand-written one. Endpoints not listed here are not yet serialized (FS-0004); they are reachable but undocumented until their group lands.
  title: Fireplace API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/users/profile:
    get:
      description: Returns the profile of the user identified by the bearer token's `sub` claim.
      operationId: getProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Get the authenticated user's profile
    patch:
      description: Partial update. An absent field and a null field both mean "leave unchanged"; an empty string sets the field to empty. An empty body is a valid no-op. Validation lives in auth-service, so an empty name is rejected with 400, not 422.
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Update the authenticated user's profile
