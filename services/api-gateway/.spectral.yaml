# Spectral ruleset for the generated OpenAPI 2.0 spec (docs/swagger.json).
#
#   make lint   ->   npx @stoplight/spectral-cli lint docs/swagger.json
#
# spectral:oas already validates that every `example` conforms to its schema —
# that is the exact class of warning this whole setup exists to catch
# (example-vs-schema drift). We extend it and only relax rules that don't fit a
# code-generated 2.0 *shape contract* (we set no contact block; operationIds are
# auto-generated by swag from handler names).
extends: ["spectral:oas"]
rules:
  info-contact: off
  operation-operationId: off
