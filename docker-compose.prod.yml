# PRODUCTION overlay. Not loaded automatically — that is deliberate.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Omitting docker-compose.override.yml is what keeps the local dev ports off the
# host. This file runs the prebuilt images, puts the gateway behind the droplet's
# shared edge Caddy (ADR-0017), and turns every dev-defaulted secret into a
# required variable, so a missing one fails at `compose up` instead of booting
# production on a password committed to git.
#
# On the droplet this stack lives in /opt/fireplace. The deploy workflow copies
# this file, the base file and scripts/db/init-databases.sh there on every run.

services:
  # --- Images come from GHCR, never built on the droplet (ADR-0017) ----------
  # CI pins each to the commit's :<sha> tag; .env keeps :latest for manual runs.
  # `build: !reset null` drops the base file's build section, so a missing image
  # fails the pull instead of starting a Go compile on a shared 4 GB box.

  gateway-migrate:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be set}
    build: !reset null
    environment:
      DB_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:?GATEWAY_OWNER_PASSWORD must be set}

  # The ONLY service the edge Caddy can reach. It joins the edge network, which
  # the tomato-timer stack owns, and Caddy proxies to it by container name
  # (fireplace_api_gateway:8080; see deploy/edge-site.caddy). It still publishes
  # no host port. Everything else stays on fireplace-network alone.
  api-gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be set}
    build: !reset null
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DB_PASSWORD: ${GATEWAY_APP_PASSWORD:?GATEWAY_APP_PASSWORD must be set}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      # The deployed frontend's origin(s), comma-separated. Without it the
      # browser's CORS check rejects every call from the Vercel site.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
    networks: [fireplace-network, edge]

  plan-migrate:
    image: ${PLAN_IMAGE:?PLAN_IMAGE must be set}
    build: !reset null
    environment:
      DB_OWNER_PASSWORD: ${PLANS_OWNER_PASSWORD:?PLANS_OWNER_PASSWORD must be set}

  plan-service:
    image: ${PLAN_IMAGE:?PLAN_IMAGE must be set}
    build: !reset null
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DB_PASSWORD: ${PLANS_APP_PASSWORD:?PLANS_APP_PASSWORD must be set}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}

  insights-migrate:
    image: ${INSIGHTS_IMAGE:?INSIGHTS_IMAGE must be set}
    build: !reset null
    environment:
      DB_OWNER_PASSWORD: ${INSIGHTS_OWNER_PASSWORD:?INSIGHTS_OWNER_PASSWORD must be set}

  insights-service:
    image: ${INSIGHTS_IMAGE:?INSIGHTS_IMAGE must be set}
    build: !reset null
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DB_PASSWORD: ${INSIGHTS_APP_PASSWORD:?INSIGHTS_APP_PASSWORD must be set}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      # Global daily token budget (ADR-0019, FS-02JBZ R34, D8).
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}

  # --- Infrastructure: secrets become REQUIRED (ADR-0012 §5) -----------------
  # The base file defaults these so local dev works out of the box. Here they
  # have no default: a missing value stops the deploy.

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?POSTGRES_SUPER_PASSWORD must be set}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:?GATEWAY_OWNER_PASSWORD must be set}
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:?GATEWAY_APP_PASSWORD must be set}
      PLANS_OWNER_PASSWORD: ${PLANS_OWNER_PASSWORD:?PLANS_OWNER_PASSWORD must be set}
      PLANS_APP_PASSWORD: ${PLANS_APP_PASSWORD:?PLANS_APP_PASSWORD must be set}
      INSIGHTS_OWNER_PASSWORD: ${INSIGHTS_OWNER_PASSWORD:?INSIGHTS_OWNER_PASSWORD must be set}
      INSIGHTS_APP_PASSWORD: ${INSIGHTS_APP_PASSWORD:?INSIGHTS_APP_PASSWORD must be set}

  fireplace-rabbitmq:
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=fireplace
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}

  redis:
    restart: unless-stopped

networks:
  # The edge Caddy's network, created by the tomato-timer stack (/opt/tomato-timer).
  # After Dark joins it the same way.
  edge:
    external: true
    name: tomato-timer_default
