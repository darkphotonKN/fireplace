syntax = "proto3";
package events;

option go_package = "github.com/darkphotonKN/fireplace/common/api/proto/events";

// Insight domain events — emitted by insights-service onto the "insights.events"
// exchange (FS-0006 R18, R19a-d).
//
// Both messages are FACTS: named for what happened, never for what should happen
// next. insights-service does not know plan-service consumes them (ADR-0008).

// InsightItem is one item out of a generated Insight — the CREATABLE SUBSET of a
// checklist item, deliberately the same shape as one, minus everything the
// database owns.
//
// Named for its ORIGIN, not its destination. It is never persisted in this
// shape: it exists for exactly one hop and is dead the instant the materializing
// transaction commits. Calling it a "generated item" would collide with
// plan-service's `generated` item STATUS (CONTEXT.md), which is the term
// ADR-0007 leans on when deciding what a regeneration is allowed to destroy —
// and that is the last word in this design that should be ambiguous. No id, plan_id, status,
// done, created_at or updated_at: those are assigned by the materializing
// transaction, not carried on the wire.
//
// There is intentionally NO sequence field. ARRAY ORDER IS SEQUENCE. An explicit
// field could disagree with the order it sits in; order cannot disagree with
// itself (FS-0006 R19c).
//
// There are intentionally NO dates. AI auto-scheduling of start_date / due_date
// is an unshipped plan-service capability; materialized items arrive unscheduled
// (FS-0006 R19d).
message InsightItem {
  string description = 1;

  // "daily" | "longterm" — plan-service's checklist scope.
  string scope = 2;

  // "task" | "note".
  string type = 3;

  // Index into the SAME items array identifying this item's parent, because no
  // row IDs exist before the materialization transaction opens (FS-0006 R19b).
  //
  // `optional` is load-bearing: without it, proto3 cannot distinguish "no parent"
  // from "parent is index 0", and index 0 is a legal parent.
  optional int32 parent_index = 4;
}

// InsightGeneratedEvent carries the generated items themselves, so plan-service
// materializes without calling back and never depends on insights being
// reachable (FS-0006 R19).
message InsightGeneratedEvent {
  string plan_id = 1;
  string user_id = 2;
  repeated InsightItem items = 3;
}

// FailureClass is the vocabulary for WHY a plan's generation ended badly.
//
// It is an enum rather than a free string because it crosses a service boundary
// and the consumer switches on it to pick user-facing copy and to decide whether
// a retry action appears at all (FS-0006 R37). A free string lets the producer
// and the consumer disagree with nothing to catch it — the same silent drift the
// rest of this package exists to prevent.
//
// Values are added only for failures the system actually produces, never
// speculatively. Note the absence of a "poison"/"bug" class: that path
// dead-letters and publishes no event, so it never travels on this wire
// (FS-0006 R29). plan-service sets STALLED locally from its sweeper rather than
// receiving it, but the vocabulary is shared so the client sees one set of
// values whatever produced them.
enum FailureClass {
  // Zero value, and deliberately not retryable — see Retryable(). A producer
  // that leaves it unset is a bug, and the consumer must fail toward the
  // conservative answer rather than offering a button that spends money.
  FAILURE_CLASS_UNSPECIFIED = 0;

  // Transient failures survived the full backoff ladder (FS-0006 R27).
  // Nothing is broken, so retrying on the spot is the fastest recovery.
  FAILURE_CLASS_GENERATION_EXHAUSTED = 1;

  // No outcome ever arrived and the sweeper gave up (FS-0006 R31). A panic or
  // OOM runs no error handler, so nothing reported; the work may simply be gone.
  FAILURE_CLASS_STALLED = 2;
}

// InsightGenerationFailedEvent is published when TRANSIENT retries are exhausted
// — not for poison messages, which dead-letter instead (FS-0006 R26, R27).
//
// failure_class travels with it because "failed" alone cannot drive the two
// things that depend on it: what the user is told, and whether a retry action is
// offered at all (FS-0006 R37).
message InsightGenerationFailedEvent {
  string plan_id = 1;
  string user_id = 2;
  FailureClass failure_class = 3;
}
