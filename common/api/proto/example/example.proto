syntax = "proto3";
package example;

option go_package = "github.com/darkphotonKN/fireplace/common/api/proto/example";

// ExampleService — decorative service demonstrating the gRPC + AMQP
// publish/consume pattern. Not load-bearing; used as a template for future
// extractions from the monolith.
service ExampleService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
  string served_by = 2;
}
