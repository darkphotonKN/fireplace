version: "3.9"

# Root infra for the fireplace strangler migration.
#
# This file declares the cross-service infrastructure (service discovery,
# message broker, cache) plus the monolith's database. As domains are
# peeled off into their own services under services/, each gets its own
# postgres entry here.
#
# Ports are intentionally offset from cosmic-void's defaults so both can
# run side-by-side on the same machine.

services:
  fireplace-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: fireplace-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=fireplace
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-fireplace}
    volumes:
      - fireplace-rabbitmq-data:/var/lib/rabbitmq
    # The app tier gates on this being HEALTHY, not merely started: RabbitMQ
    # takes ~15s to accept connections, and a service that dials it at second 2
    # dies on connection refused.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - fireplace-network

  redis:
    image: redis:7-alpine
    container_name: fireplace-redis
    command: redis-server --appendonly yes
    volumes:
      - fireplace-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fireplace-network

  # Monolith DB. Becomes api-gateway-db once Phase 2 lands.
  # --- PostgreSQL: ONE instance, THREE databases (ADR-0010) ---
  #
  # fireplace_gateway / fireplace_plans / fireplace_insights. Not three schemas
  # in one database: PostgreSQL cannot query across databases, so the isolation
  # is enforced by the planner rather than by grant hygiene. Roles, grants and
  # extensions are created by scripts/db/init-databases.sh on FIRST BOOT of an
  # empty volume — change that script and you must `docker compose down -v`.
  #
  # plan-service and insights-service must never share a database (ADR-0010 §3):
  # the effectively-once guarantee rests on producer and consumer being unable
  # to enlist in one transaction.
  postgres:
    image: postgres:17
    container_name: fireplace_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:-owner}
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:-app}
      PLANS_OWNER_PASSWORD: ${PLANS_OWNER_PASSWORD:-owner}
      PLANS_APP_PASSWORD: ${PLANS_APP_PASSWORD:-app}
      INSIGHTS_OWNER_PASSWORD: ${INSIGHTS_OWNER_PASSWORD:-owner}
      INSIGHTS_APP_PASSWORD: ${INSIGHTS_APP_PASSWORD:-app}
    volumes:
      - fireplace_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fireplace-network

  # --- Application tier (ADR-0012 §1) ---
  #
  # First containerization of the Go services. Each image carries its service
  # binary AND ./migrate, so migrations ship with the code that expects them.
  #
  # Every service depends on a one-shot <svc>-migrate container completing
  # successfully. That is what makes ADR-0010 §4 real: migrations run as
  # <db>_owner, to completion, BEFORE the app starts, and a failed migration
  # stops the app from starting at all rather than letting it serve traffic
  # against a half-applied schema.
  #
  # Services bind :PORT, never localhost, and reach each other by container name
  # over Docker DNS — no Consul (ADR-0012 §4).

  gateway-migrate:
    image: fireplace/api-gateway:dev
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    container_name: fireplace_gateway_migrate
    entrypoint: ["/app/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_gateway
      DB_OWNER_USER: fireplace_gateway_owner
      DB_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:-owner}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [fireplace-network]

  api-gateway:
    image: fireplace/api-gateway:dev
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    container_name: fireplace_api_gateway
    environment:
      PORT: 8080
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_gateway
      DB_USER: fireplace_gateway_app
      DB_PASSWORD: ${GATEWAY_APP_PASSWORD:-app}
      # Static discovery — container names, resolved by Docker DNS.
      PLAN_SERVICE_ADDR: plan-service:7103
      INSIGHTS_SERVICE_ADDR: insights-service:7106
      RABBITMQ_USER: fireplace
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-fireplace}
      RABBITMQ_HOST: fireplace-rabbitmq
      RABBITMQ_PORT: 5672
      OTEL_ENABLED: "false"
      # Secrets come from the host environment, never the repo (ADR-0012 §5).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ACCESS_TOKEN_TTL: 24h
      REFRESH_TOKEN_TTL: 168h
    # NOT published here. In production Caddy fronts it (docker-compose.prod.yml);
    # locally docker-compose.override.yml publishes 8080 directly.
    depends_on:
      gateway-migrate: { condition: service_completed_successfully }
      fireplace-rabbitmq: { condition: service_healthy }
    networks: [fireplace-network]

  plan-migrate:
    image: fireplace/plan-service:dev
    build: { context: ., dockerfile: services/plan-service/Dockerfile }
    container_name: fireplace_plan_migrate
    entrypoint: ["/app/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_plans
      DB_OWNER_USER: fireplace_plans_owner
      DB_OWNER_PASSWORD: ${PLANS_OWNER_PASSWORD:-owner}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [fireplace-network]

  plan-service:
    image: fireplace/plan-service:dev
    build: { context: ., dockerfile: services/plan-service/Dockerfile }
    container_name: fireplace_plan_service
    environment:
      GRPC_PLAN_ADDR: 7103
      ADVERTISE_HOST: plan-service
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_plans
      DB_USER: fireplace_plans_app
      DB_PASSWORD: ${PLANS_APP_PASSWORD:-app}
      RABBITMQ_USER: fireplace
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-fireplace}
      RABBITMQ_HOST: fireplace-rabbitmq
      RABBITMQ_PORT: 5672
      OTEL_ENABLED: "false"
    depends_on:
      plan-migrate: { condition: service_completed_successfully }
      fireplace-rabbitmq: { condition: service_healthy }
    networks: [fireplace-network]

  insights-migrate:
    image: fireplace/insights-service:dev
    build: { context: ., dockerfile: services/insights-service/Dockerfile }
    container_name: fireplace_insights_migrate
    entrypoint: ["/app/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_insights
      DB_OWNER_USER: fireplace_insights_owner
      DB_OWNER_PASSWORD: ${INSIGHTS_OWNER_PASSWORD:-owner}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [fireplace-network]

  insights-service:
    image: fireplace/insights-service:dev
    build: { context: ., dockerfile: services/insights-service/Dockerfile }
    container_name: fireplace_insights_service
    environment:
      GRPC_INSIGHTS_ADDR: 7106
      ADVERTISE_HOST: insights-service
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fireplace_insights
      DB_USER: fireplace_insights_app
      DB_PASSWORD: ${INSIGHTS_APP_PASSWORD:-app}
      PLAN_SERVICE_ADDR: plan-service:7103
      RABBITMQ_USER: fireplace
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-fireplace}
      RABBITMQ_HOST: fireplace-rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_ADDR: fireplace-redis:6379
      OTEL_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      insights-migrate: { condition: service_completed_successfully }
      fireplace-rabbitmq: { condition: service_healthy }
    networks: [fireplace-network]

networks:
  fireplace-network:
    name: fireplace-network

volumes:
  fireplace-rabbitmq-data:
  fireplace-redis-data:
  fireplace_pgdata:
  fireplace_pgdata_test:
