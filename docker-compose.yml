version: "3.9"

# Root infra for the fireplace strangler migration.
#
# This file declares the cross-service infrastructure (service discovery,
# message broker, cache) plus the monolith's database. As domains are
# peeled off into their own services under services/, each gets its own
# postgres entry here.
#
# Ports are intentionally offset from cosmic-void's defaults so both can
# run side-by-side on the same machine.

services:
  fireplace-consul:
    image: hashicorp/consul
    container_name: fireplace-consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8520:8500"
      - "8620:8600/udp"
    volumes:
      - fireplace-consul-data:/consul/data
    networks:
      - fireplace-network

  fireplace-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: fireplace-rabbitmq
    ports:
      - "5683:5672"
      - "15683:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=fireplace
      - RABBITMQ_DEFAULT_PASS=fireplace
    volumes:
      - fireplace-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fireplace-network

  redis:
    image: redis:7-alpine
    container_name: fireplace-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - fireplace-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fireplace-network

  # Monolith DB. Becomes api-gateway-db once Phase 2 lands.
  db:
    image: postgres:17
    container_name: flow_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_db
    ports:
      - "5556:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fireplace-network

  # Auth Service Database (ordinal 1)
  auth-service-db:
    image: postgres:17
    container_name: fireplace_auth_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_auth_service_db
    ports:
      - "5301:5432"
    volumes:
      - fireplace_auth_service_pgdata:/var/lib/postgresql/data
    networks:
      - fireplace-network

  auth-service-test-db:
    image: postgres:17
    container_name: fireplace_auth_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_auth_service_test_db
    ports:
      - "6301:5432"
    volumes:
      - fireplace_auth_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - fireplace-network

  # Example Service Database (ordinal 2)
  example-service-db:
    image: postgres:17
    container_name: fireplace_example_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_example_service_db
    ports:
      - "5302:5432"
    volumes:
      - fireplace_example_service_pgdata:/var/lib/postgresql/data
    networks:
      - fireplace-network

  example-service-test-db:
    image: postgres:17
    container_name: fireplace_example_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_example_service_test_db
    ports:
      - "6302:5432"
    volumes:
      - fireplace_example_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - fireplace-network

  # Plan Service Database (ordinal 3)
  plan-service-db:
    image: postgres:17
    container_name: fireplace_plan_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_plan_service_db
    ports:
      - "5303:5432"
    volumes:
      - fireplace_plan_service_pgdata:/var/lib/postgresql/data
    networks:
      - fireplace-network

  plan-service-test-db:
    image: postgres:17
    container_name: fireplace_plan_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_plan_service_test_db
    ports:
      - "6303:5432"
    volumes:
      - fireplace_plan_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - fireplace-network

  # Calendar Service Database (ordinal 4)
  calendar-service-db:
    image: postgres:17
    container_name: fireplace_calendar_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_calendar_service_db
    ports:
      - "5304:5432"
    volumes:
      - fireplace_calendar_service_pgdata:/var/lib/postgresql/data
    networks:
      - fireplace-network

  calendar-service-test-db:
    image: postgres:17
    container_name: fireplace_calendar_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fireplace_calendar_service_test_db
    ports:
      - "6304:5432"
    volumes:
      - fireplace_calendar_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - fireplace-network

  # Orchestrator Service (ordinal 5) — NO DATABASE.
  # orchestrator-service coordinates other services over gRPC + AMQP and owns no
  # data, so it has no postgres entry here (and no DB_* env). It registers in
  # Consul and binds gRPC on 7105; it only needs the shared infra above
  # (fireplace-consul + fireplace-rabbitmq) to run. Ordinal 5 / ports 5305+6305
  # are reserved should it ever gain a DB.

  # --- Temporal (workflow orchestration) ---
  temporal-postgres:
    image: postgres:16
    container_name: fireplace-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5440:5432" # off to the side so it can't clash with your service DBs
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: fireplace-temporal
    depends_on:
      - temporal-postgres
    environment:
      - DB=postgres12 # driver name; works for pg12+ incl. 16
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres # hostname of the pg container
    ports:
      - "7233:7233" # frontend gRPC — your worker dials this
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: fireplace-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080" # Web UI at http://localhost:8233

networks:
  fireplace-network:
    name: fireplace-network

volumes:
  fireplace-consul-data:
  fireplace-rabbitmq-data:
  fireplace-redis-data:
  pgdata:
  fireplace_auth_service_pgdata:
  fireplace_auth_service_test_pgdata:
  fireplace_example_service_pgdata:
  fireplace_example_service_test_pgdata:
  fireplace_plan_service_pgdata:
  fireplace_plan_service_test_pgdata:
  fireplace_calendar_service_pgdata:
  fireplace_calendar_service_test_pgdata:
  temporal-pgdata:
