syntax = "proto3";
package plan;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/darkphotonKN/fireplace/common/api/proto/plan";

// PlanService — owns plans (high-level projects/goals). All RPCs take the
// authenticated user_id explicitly; the gateway extracts it from the JWT and
// passes it in the request payload. plan-service trusts that input.
service PlanService {
  rpc CreatePlan(CreatePlanRequest) returns (Plan);
  rpc GetPlan(GetPlanRequest) returns (Plan);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc ListSharedPlans(ListSharedPlansRequest) returns (ListPlansResponse);
  rpc SearchPlans(SearchPlansRequest) returns (SearchPlansResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (Plan);
  rpc ToggleDailyReset(ToggleDailyResetRequest) returns (Plan);
  rpc DeletePlan(DeletePlanRequest) returns (google.protobuf.Empty);

  // AssertPlanOwnership returns OK if the plan exists and is owned by user_id;
  // returns NotFound or PermissionDenied otherwise. Cheap ownership check for
  // sibling services (calendar, notes, etc.) before they touch plan-scoped
  // resources they own.
  rpc AssertPlanOwnership(AssertPlanOwnershipRequest) returns (google.protobuf.Empty);

  // GetPlanAccess answers the caller's relation to a plan (ADR-0015 §1-2). It
  // never enforces anything: the gateway decides what each relation may do.
  // A plan that does not exist is PLAN_RELATION_NONE, never NotFound, so the
  // answer cannot tell a stranger apart from a missing plan.
  rpc GetPlanAccess(GetPlanAccessRequest) returns (GetPlanAccessResponse);

  // Plan members (FS-12ZMF R15-R21). plan-service holds only user ids; the
  // gateway resolves names and emails from its own users table.
  //
  // ListPlanMembers answers the plan's owner, its creation time and its members
  // in add order. NotFound if no plan. The gateway decides who may ask.
  rpc ListPlanMembers(ListPlanMembersRequest) returns (ListPlanMembersResponse);
  // AddPlanMember shares a plan the caller owns with member_user_id, with role
  // 'edit'. Re-adding returns the existing member and its original since.
  // InvalidArgument when member_user_id is the owner (MEMBER_IS_OWNER);
  // NotFound when the caller owns no such plan.
  rpc AddPlanMember(AddPlanMemberRequest) returns (PlanMember);
  // RemovePlanMember deletes member_user_id's share on a plan the caller owns.
  // NotFound when there is no such share (the owner's own id included) or the
  // caller owns no such plan.
  rpc RemovePlanMember(RemovePlanMemberRequest) returns (google.protobuf.Empty);
}

message Plan {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string focus = 4;
  string description = 5;
  string plan_type = 6;
  bool daily_reset = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreatePlanRequest {
  string user_id = 1;
  string name = 2;
  string focus = 3;
  string description = 4;
  string plan_type = 5;
  bool daily_reset = 6;
}

message GetPlanRequest {
  string id = 1;
  string user_id = 2;
}

message ListPlansRequest {
  string user_id = 1;
  // When true, the plans user_id owns or is a member of (owned ∪ shared),
  // each once, created_at desc, unpaged (FS-12ZMF R22). Default false keeps
  // the owned-only list.
  bool include_shared = 2;
}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message ListSharedPlansRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message SearchPlansRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchPlanResult {
  string id = 1;
  string name = 2;
  string description = 3;
  float similarity = 4;
}

message SearchPlansResponse {
  repeated SearchPlanResult results = 1;
}

message UpdatePlanRequest {
  string id = 1;
  string user_id = 2;
  optional string name = 3;
  optional string focus = 4;
  optional string description = 5;
  optional string plan_type = 6;
  optional bool daily_reset = 7;
}

message ToggleDailyResetRequest {
  string id = 1;
  string user_id = 2;
}

message DeletePlanRequest {
  string id = 1;
  string user_id = 2;
}

message AssertPlanOwnershipRequest {
  string plan_id = 1;
  string user_id = 2;
}

// PlanRelation is a user's relation to one plan. A plan_shares row's role does
// not change it in v1: any row makes a member.
enum PlanRelation {
  PLAN_RELATION_UNSPECIFIED = 0;
  PLAN_RELATION_NONE = 1;
  PLAN_RELATION_OWNER = 2;
  PLAN_RELATION_MEMBER = 3;
}

message GetPlanAccessRequest {
  string plan_id = 1;
  string user_id = 2;
}

message GetPlanAccessResponse {
  PlanRelation relation = 1;
  // owner_id is set whenever the plan exists, whatever the relation.
  string owner_id = 2;
}

// PlanMember is one share on a plan: who, and since when.
message PlanMember {
  string user_id = 1;
  google.protobuf.Timestamp since = 2;
}

message ListPlanMembersRequest {
  string plan_id = 1;
  string user_id = 2;
}

message ListPlanMembersResponse {
  string owner_id = 1;
  google.protobuf.Timestamp plan_created_at = 2;
  // Ordered by since, oldest first. Never includes the owner.
  repeated PlanMember members = 3;
}

message AddPlanMemberRequest {
  string plan_id = 1;
  // The caller, who must own the plan.
  string user_id = 2;
  string member_user_id = 3;
}

message RemovePlanMemberRequest {
  string plan_id = 1;
  // The caller, who must own the plan.
  string user_id = 2;
  string member_user_id = 3;
}
