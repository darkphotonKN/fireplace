syntax = "proto3";
package insights;

option go_package = "github.com/darkphotonKN/fireplace/common/api/proto/insights";

import "google/protobuf/timestamp.proto";

// InsightsService — AI-generated productivity suggestions for a plan. It owns no
// durable data of its own today; it reads plan focus + checklist items from
// plan-service over gRPC and calls an LLM to produce suggestions. The reserved
// insights-service-db (ordinal 6) is for future caching/persistence of
// generated insights.
//
// user_id is carried on every request so insights can assert plan ownership
// against plan-service before generating anything (same trust model as the
// other services: the gateway authenticates and forwards the user_id).
service InsightsService {
  // GenerateSuggestion returns a single, actionable next checklist item for the
  // plan, derived from its focus + current checklist.
  rpc GenerateSuggestion(GenerateSuggestionRequest) returns (GenerateSuggestionResponse);

  // SuggestVideos returns recommended learning videos for the plan.
  rpc SuggestVideos(SuggestVideosRequest) returns (SuggestVideosResponse);

  // GetDayPlan returns the stored day plan for (plan, user, date), or status
  // "not_planned" with no groups when none is stored (FS-02JBZ R14). It never
  // calls the model, never draws by rules and never copies another date's
  // plan forward. A date more than one day from the server's UTC date is
  // InvalidArgument with ErrorInfo reason BRIEF_DATE_OUT_OF_RANGE.
  rpc GetDayPlan(GetDayPlanRequest) returns (GetDayPlanResponse);

  // PlanMyDay draws or redraws the day plan for (plan, user, date) and returns
  // what the key then serves (FS-02JBZ R13-R21). An unchanged plan returns the
  // stored ai plan with no generation. The key's first successful AI draw is
  // free; later ones spend from the per (plan, user, date) refresh counter,
  // and past its cap of 3 the call is ResourceExhausted with ErrorInfo reason
  // BRIEF_REFRESH_LIMIT_REACHED and the stored plan is untouched. A plan
  // plan-service does not have is NotFound. A failed generation (the token
  // budget spent, the provider down, output outside the schema) is not an
  // error: it falls back to a rules plan, stored with source "rules", and
  // gives back any refresh it spent (R36). A draw that loses to a concurrent
  // draw, tick or untick returns the stored plan and spends nothing.
  rpc PlanMyDay(PlanMyDayRequest) returns (PlanMyDayResponse);

  // TickDayPlanEntry marks an entry of the caller's day plan done for its plan
  // date and returns the entry, ticked (FS-02JBZ R24-R28, R30). An
  // existing_item entry takes no item_id, or its own. An unbound new_step
  // entry needs item_id: the item the user created from it, which must be a
  // non-archived task under the entry's parent in the same plan; the entry is
  // then bound (kind existing_item for that item, text and reason kept).
  // Refusals: an entry that is not the caller's is NotFound; an entry that
  // cannot be ticked is FailedPrecondition with ErrorInfo reason
  // DAY_PLAN_ENTRY_NOT_TICKABLE; a plan date outside the date rule is
  // InvalidArgument with BRIEF_DATE_OUT_OF_RANGE. Ticking a ticked entry
  // returns it unchanged. The item's done is never changed.
  rpc TickDayPlanEntry(TickDayPlanEntryRequest) returns (TickDayPlanEntryResponse);

  // UntickDayPlanEntry removes the day tick of an entry of the caller's day
  // plan for its plan date (FS-02JBZ R29, R30). Unticking an unticked entry
  // succeeds and changes nothing. Refusals are TickDayPlanEntry's NotFound
  // and date rule.
  rpc UntickDayPlanEntry(UntickDayPlanEntryRequest) returns (UntickDayPlanEntryResponse);

  // SetItemRevisions switches the revision ladder on or off for one item of
  // the caller's plan (FS-02JBZ R47, R48). Off cancels the item's open
  // revision and schedules no more; on schedules nothing by itself, and the
  // item's next day tick schedules the next rung, never past revision 3. A
  // plan the caller cannot access, or an item not in the plan, is NotFound.
  // On a project plan it is accepted and has no effect.
  rpc SetItemRevisions(SetItemRevisionsRequest) returns (SetItemRevisionsResponse);
}

message GenerateSuggestionRequest {
  string plan_id = 1;
  string user_id = 2;
}

message GenerateSuggestionResponse {
  string suggestion = 1;
}

message SuggestVideosRequest {
  string plan_id = 1;
  string user_id = 2;
}

// Video mirrors the shape the frontend already consumes for video suggestions.
message Video {
  string title = 1;
  string url = 2;
  string source = 3;
  string type = 4;
  string description = 5;
}

message SuggestVideosResponse {
  repeated Video videos = 1;
}

message GetDayPlanRequest {
  string plan_id = 1;
  // user_id is the caller's verified identity, forwarded by the gateway.
  string user_id = 2;
  // date is the user's local calendar date, YYYY-MM-DD.
  string date = 3;
}

message GetDayPlanResponse {
  DayPlan day_plan = 1;
}

message PlanMyDayRequest {
  string plan_id = 1;
  // user_id is the caller's verified identity, forwarded by the gateway.
  string user_id = 2;
  // date is the user's local calendar date, YYYY-MM-DD.
  string date = 3;
}

message PlanMyDayResponse {
  DayPlan day_plan = 1;
}

message TickDayPlanEntryRequest {
  string entry_id = 1;
  // user_id is the caller's verified identity, forwarded by the gateway.
  string user_id = 2;
  // item_id is the item a new_step entry is bound to; for an existing_item
  // entry, unset or the entry's own item.
  optional string item_id = 3;
}

message TickDayPlanEntryResponse {
  DayPlanEntry entry = 1;
}

message UntickDayPlanEntryRequest {
  string entry_id = 1;
  // user_id is the caller's verified identity, forwarded by the gateway.
  string user_id = 2;
}

message UntickDayPlanEntryResponse {}

message SetItemRevisionsRequest {
  string plan_id = 1;
  // user_id is the caller's verified identity, forwarded by the gateway.
  string user_id = 2;
  string item_id = 3;
  bool enabled = 4;
}

message SetItemRevisionsResponse {}

// DayPlan is up to 6 entries in up to 3 groups for one user on one plan for
// one local date.
message DayPlan {
  string plan_id = 1;
  // date is the key's date as sent, YYYY-MM-DD.
  string date = 2;
  // status is "planned" or "not_planned".
  string status = 3;
  // source is "ai" or "rules"; set iff status is "planned".
  optional string source = 4;
  // generated_at is when the plan was drawn; set iff status is "planned".
  google.protobuf.Timestamp generated_at = 5;
  int32 refreshes_remaining = 6;
  repeated DayPlanGroup groups = 7;
}

// DayPlanGroup is a short label over related entries. It has no id.
message DayPlanGroup {
  string label = 1;
  repeated DayPlanEntry entries = 2;
}

// DayPlanEntry is one thing to do on the plan date.
message DayPlanEntry {
  // id is the entry id, usable as a suggestion id.
  string id = 1;
  // kind is "existing_item" or "new_step".
  string kind = 2;
  // item_id is set iff kind is "existing_item".
  optional string item_id = 3;
  // parent_item_id is the parent a new step goes under, or an existing item's
  // parent when it has one.
  optional string parent_item_id = 4;
  string text = 5;
  string reason = 6;
  // minutes is the rough estimate, 5-240; unset on rules entries.
  optional int32 minutes = 7;
  // revision is 1-3, set by the server only.
  optional int32 revision = 8;
  // ticked is the day tick for this entry's date.
  bool ticked = 9;
  // revisions_enabled is the item's revisions switch; set only on
  // existing_item entries of learning plans.
  optional bool revisions_enabled = 10;
}
