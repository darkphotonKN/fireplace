syntax = "proto3";
package events;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/darkphotonKN/fireplace/common/api/proto/events";

// Plan domain events — emitted by plan-service onto the "plan.events" exchange.

message PlanCreatedEvent {
  string id = 1;
  string user_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message PlanDeletedEvent {
  string id = 1;
  string user_id = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

message ChecklistItemCompletedEvent {
  string id = 1;
  string plan_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp completed_at = 4;
}

message ChecklistItemUncompletedEvent {
  string id = 1;
  string plan_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp uncompleted_at = 4;
}
