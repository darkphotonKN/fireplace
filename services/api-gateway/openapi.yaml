components:
  schemas:
    AuthResponse:
      additionalProperties: false
      properties:
        accessExpiresIn:
          description: Access token lifetime in NANOSECONDS
          format: int64
          type: integer
        accessToken:
          description: Bearer token for the Authorization header
          type: string
        refreshExpiresIn:
          description: Refresh token lifetime in NANOSECONDS
          format: int64
          type: integer
        refreshToken:
          description: Refresh token
          type: string
        userInfo:
          $ref: "#/components/schemas/UserResponse"
          description: The authenticated user
      required:
        - refreshToken
        - accessToken
        - accessExpiresIn
        - refreshExpiresIn
        - userInfo
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable domain error code — switch on THIS, not on detail
          examples:
            - NOT_FOUND
          type: string
        detail:
          description: Explanation specific to this occurrence
          type: string
        errors:
          description: Field-level detail; empty for downstream failures
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          description: HTTP status code
          format: int64
          type: integer
        title:
          description: Short, stable summary of the problem type
          type: string
        type:
          description: URI reference identifying the problem type
          type: string
      required:
        - code
        - errors
      type: object
    ProfileResponse:
      additionalProperties: false
      properties:
        bio:
          description: Optional short biography
          type:
            - string
            - "null"
        createdAt:
          description: When the account was created
          format: date-time
          type: string
        displayName:
          description: Optional display name
          examples:
            - kn
          type:
            - string
            - "null"
        email:
          description: Email address
          examples:
            - a@b.com
          type: string
        id:
          description: User id
          type: string
        name:
          description: Account name
          examples:
            - Kranti
          type: string
        updatedAt:
          description: When the profile was last changed
          format: date-time
          type: string
      required:
        - id
        - email
        - name
        - displayName
        - bio
        - createdAt
        - updatedAt
      type: object
    SigninRequest:
      additionalProperties: false
      properties:
        email:
          description: Email address
          examples:
            - a@b.com
          type: string
        password:
          description: Plaintext password
          type: string
      required:
        - email
        - password
      type: object
    SignupRequest:
      additionalProperties: false
      properties:
        email:
          description: Email address
          examples:
            - a@b.com
          type: string
        name:
          description: Account name
          examples:
            - Kranti
          type: string
        password:
          description: Plaintext password; hashed by auth-service
          type: string
      required:
        - email
        - password
        - name
      type: object
    UpdateProfileRequest:
      additionalProperties: false
      properties:
        bio:
          type: string
        displayName:
          type: string
        name:
          type: string
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        bio:
          description: Optional short biography
          type:
            - string
            - "null"
        createdAt:
          description: When the account was created
          format: date-time
          type: string
        displayName:
          description: Optional display name
          examples:
            - kn
          type:
            - string
            - "null"
        email:
          description: Email address
          examples:
            - a@b.com
          type: string
        id:
          description: User id
          type: string
        name:
          description: Account name
          examples:
            - Kranti
          type: string
        updatedAt:
          description: When the user was last changed
          format: date-time
          type: string
      required:
        - id
        - email
        - name
        - displayName
        - bio
        - createdAt
        - updatedAt
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token sent as `Authorization: Bearer <token>`."
      scheme: bearer
      type: http
info:
  description: The HTTP surface of the Fireplace api-gateway. This document is generated from the typed handlers and is the only description of the API — there is no second, hand-written one. Endpoints not listed here are not yet serialized (FS-0004); they are reachable but undocumented until their group lands.
  title: Fireplace API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/users:
    get:
      description: Returns every user. UNBOUNDED — there is no pagination today, and this is transcribed as-is (ADR-0006 §2). Adding pagination later is a breaking change to a shape that arguably should not have been published unbounded.
      operationId: listUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserResponse"
                type:
                  - array
                  - "null"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: List users
  /api/users/profile:
    get:
      description: Returns the profile of the user identified by the bearer token's `sub` claim.
      operationId: getProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Get the authenticated user's profile
    patch:
      description: Partial update. An absent field and a null field both mean "leave unchanged"; an empty string sets the field to empty. An empty body is a valid no-op. Validation lives in auth-service, so an empty name is rejected with 400, not 422.
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Update the authenticated user's profile
  /api/users/signin:
    post:
      description: Exchanges email and password for an access/refresh token pair. Expiry fields are in NANOSECONDS, inherited from the monolith. A 401 here means bad credentials — it does not mean a token was missing.
      operationId: signin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Sign in
  /api/users/signup:
    post:
      description: "Registers a new user. Returns 201 with an EMPTY body: auth-service issues a token pair on signup, but this endpoint has always discarded it and the retrofit preserves that. Sign in afterwards to obtain tokens."
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Create an account
  /api/users/{id}:
    get:
      description: Returns the public profile of any user. Identity is required but not checked against the id — this is not the caller's own profile, which is GET /api/users/profile.
      operationId: getUser
      parameters:
        - description: User id
          in: path
          name: id
          required: true
          schema:
            description: User id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Get a user by id
