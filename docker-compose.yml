version: "3.9"

# Root infra for the fireplace strangler migration.
#
# This file declares the cross-service infrastructure (service discovery,
# message broker, cache) plus the monolith's database. As domains are
# peeled off into their own services under services/, each gets its own
# postgres entry here.
#
# Ports are intentionally offset from cosmic-void's defaults so both can
# run side-by-side on the same machine.

services:
  fireplace-consul:
    image: hashicorp/consul
    container_name: fireplace-consul
    # server_rejoin_age_max defaults to 168h: a single-node dev agent that sits
    # idle longer than a week refuses to rejoin its own cluster and exits 1
    # ("consider wiping your data dir"), which then panics every service at
    # Consul registration. There is no cluster to protect here (bootstrap-expect=1,
    # discovery only, no KV), so raise it out of the way.
    command: >
      agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
      -hcl='server_rejoin_age_max="87600h"'
    ports:
      - "8520:8500"
      - "8620:8600/udp"
    volumes:
      - fireplace-consul-data:/consul/data
    networks:
      - fireplace-network

  fireplace-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: fireplace-rabbitmq
    ports:
      - "5683:5672"
      - "15683:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=fireplace
      - RABBITMQ_DEFAULT_PASS=fireplace
    volumes:
      - fireplace-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fireplace-network

  redis:
    image: redis:7-alpine
    container_name: fireplace-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - fireplace-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fireplace-network

  # Monolith DB. Becomes api-gateway-db once Phase 2 lands.
  # --- PostgreSQL: ONE instance, THREE databases (ADR-0010) ---
  #
  # fireplace_gateway / fireplace_plans / fireplace_insights. Not three schemas
  # in one database: PostgreSQL cannot query across databases, so the isolation
  # is enforced by the planner rather than by grant hygiene. Roles, grants and
  # extensions are created by scripts/db/init-databases.sh on FIRST BOOT of an
  # empty volume — change that script and you must `docker compose down -v`.
  #
  # plan-service and insights-service must never share a database (ADR-0010 §3):
  # the effectively-once guarantee rests on producer and consumer being unable
  # to enlist in one transaction.
  postgres:
    image: postgres:17
    container_name: fireplace_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      GATEWAY_OWNER_PASSWORD: owner
      GATEWAY_APP_PASSWORD: app
      PLANS_OWNER_PASSWORD: owner
      PLANS_APP_PASSWORD: app
      INSIGHTS_OWNER_PASSWORD: owner
      INSIGHTS_APP_PASSWORD: app
    ports:
      - "5500:5432"
    volumes:
      - fireplace_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fireplace-network

  # Test tier — mirrors production exactly (ADR-0010 §5) so tests exercise the
  # grant model instead of routing around it. A separate SERVER, not just
  # separate databases, so a test that drops and recreates can never reach dev
  # data by mistyping a name. Local and CI only; the VPS runs no test instance.
  postgres-test:
    image: postgres:17
    container_name: fireplace_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      DB_SUFFIX: _test
      GATEWAY_OWNER_PASSWORD: owner
      GATEWAY_APP_PASSWORD: app
      PLANS_OWNER_PASSWORD: owner
      PLANS_APP_PASSWORD: app
      INSIGHTS_OWNER_PASSWORD: owner
      INSIGHTS_APP_PASSWORD: app
    ports:
      - "6500:5432"
    volumes:
      - fireplace_pgdata_test:/var/lib/postgresql/data
      - ./scripts/db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    restart: "no"
    networks:
      - fireplace-network

networks:
  fireplace-network:
    name: fireplace-network

volumes:
  fireplace-consul-data:
  fireplace-rabbitmq-data:
  fireplace-redis-data:
  fireplace_pgdata:
  fireplace_pgdata_test:
